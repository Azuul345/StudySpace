# Backend CI: build, test, and vulnerability check for the .NET solution.
# Runs only when backend code or this workflow changes. CI only, no deployment.
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tools/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tools/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          # Caches NuGet packages. The key changes only when a project file changes.
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            tools/**/*.csproj

      - name: Restore
        run: dotnet restore StudySpace.slnx

      - name: Build
        run: dotnet build StudySpace.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test StudySpace.slnx --no-build --configuration Release

      - name: Check NuGet packages for known vulnerabilities
        # dotnet list exits 0 even when it finds vulnerabilities, so check the output.
        # Every project must print "has no vulnerable packages". Any other line that mentions
        # "vulnerab" or an advisory fails the job.
        run: |
          dotnet list StudySpace.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -v "has no vulnerable packages" vulnerable.txt | grep -qiE "vulnerab|advisor"; then
            echo "Vulnerable NuGet packages found" >&2
            exit 1
          fi
